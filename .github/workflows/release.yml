name: build-and-release

# 手动触发：构建 arm64 / armeabi-v7a APK（调试证书签名，可直接侧载）并发布到 GitHub Release。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签，例如 v1.5.1'
        required: true
        default: 'v1.5.2'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: 生成启动图标
        run: |
          pip install pillow
          python3 tool/gen_icons.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: 构建 APK（按 ABI 拆分）
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm
      - name: 重命名
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/daiban-basic-arm64-v${VER}.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/daiban-basic-armeabi-v7a-v${VER}.apk
          ls -l dist
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NOTES="待办 基础版 ${TAG}：兼容 todo.txt / topydo 的任务管理，含类别、提前/顺延、桌面组件、按任务量预计完成日期、导入导出；不含正向计时、锁屏或统计。基础版包名 cn.daiban.daiban.basic，专注版包名 cn.daiban.daiban，两版可同时安装，数据独立。专注版可覆盖更新原 v1.6.3；新基础版需手动导入原有任务。arm64-v8a（绝大多数手机）选 arm64；老设备选 armeabi-v7a。调试证书签名，需允许安装未知来源应用。基础版：https://github.com/liudadeA/daiban-todo/releases/tag/v1.5.2 ；专注版：https://github.com/liudadeA/daiban-todo/releases/tag/v1.6.4"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite assets"
            exit 1
          else
            gh release create "$TAG" dist/*.apk --target "${{ github.sha }}" --title "待办 基础版 ${TAG}" --notes "$NOTES" --latest=false
          fi
